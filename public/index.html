<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HACKERA | Discover 300+ Global Hackathons in Real-Time</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description"
    content="We scrape the web to find the best hackathons, so you don't have to. Every event, every prize, one dashboard.">

  <!-- Typography from DESIGN.md -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">
  <script src="card-utils-browser.js"></script>
</head>

<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="#" class="brand-logo">GLOBAL HACK</a>

      <nav class="nav-links">
        <a href="#" class="nav-item active">Explore</a>
        <a href="https://t.me/Hackeraoffical" class="nav-item">Community</a>
        <a href="/terms" class="nav-item">Help</a>
      </nav>

    </div>
  </header>

  <!-- Main Container -->
  <main class="main-content">

    <!-- Hero Section -->
    <section class="hero-section">
      <div class="hero-text">
        <h1 class="hero-title">
          THE HACKATHON <span class="highlight-purple">INDEX.</span>
        </h1>
        <div class="hero-badge-lime">
          <p>We scrape the web to find the best hackathons, so you don't have to. Every event, every prize, one
            dashboard.</p>
        </div>
      </div>

      <!-- Doodle Frame Illustration -->
      <div class="doodle-frame">
        <svg viewBox="0 0 450 220" class="doodle-svg" xmlns="http://www.w3.org/2000/svg">
          <!-- Background and frame -->
          <rect x="5" y="5" width="440" height="210" rx="8" fill="#ffffff" stroke="#000000" stroke-width="3" />
          <rect x="15" y="15" width="420" height="190" fill="#fdfbf7" stroke="#000000" stroke-width="2" />

          <!-- Abstract Background Swirls -->
          <path d="M 30,130 Q 80,40 180,90 T 350,50 T 420,160" fill="none" stroke="#e0e7ff" stroke-width="24"
            opacity="0.6" />
          <path d="M 50,180 Q 120,80 250,150 T 400,90" fill="none" stroke="#fef08a" stroke-width="20" opacity="0.7" />

          <!-- Doodle Elements: Laptop Left -->
          <g transform="translate(30, 30)">
            <rect x="0" y="0" width="60" height="40" rx="4" fill="#000000" />
            <rect x="4" y="4" width="52" height="32" rx="2" fill="#8455ef" />
            <path d="M -10,40 L 70,40 L 60,48 L -0,48 Z" fill="#000000" />
          </g>

          <!-- Doodle Elements: Code Brackets Center -->
          <g transform="translate(140, 25)">
            <rect x="0" y="0" width="70" height="45" rx="6" fill="#b2f746" stroke="#000000" stroke-width="3" />
            <text x="35" y="32" font-family="Space Grotesk" font-weight="700" font-size="28" text-anchor="middle"
              fill="#000000">&lt;/&gt;</text>
          </g>

          <!-- Banner Center Text -->
          <g transform="translate(100, 85)">
            <rect x="0" y="0" width="240" height="44" rx="4" fill="#ffffff" stroke="#000000" stroke-width="3"
              filter="drop-shadow(3px 3px 0px #000)" />
            <text x="120" y="28" font-family="Space Grotesk" font-weight="700" font-size="20" letter-spacing="1"
              text-anchor="middle" fill="#000000">GLOBAL HACKATHON</text>
          </g>

          <!-- Doodle Elements: Globe Right -->
          <g transform="translate(350, 25)">
            <circle cx="25" cy="25" r="22" fill="#ec4899" stroke="#000000" stroke-width="3" />
            <path d="M 3,25 H 47 M 25,3 V 47 M 8,14 Q 25,25 8,36 M 42,14 Q 25,25 42,36" stroke="#000000"
              stroke-width="2" fill="none" />
          </g>

          <!-- Doodle Elements: Laptop Right -->
          <g transform="translate(340, 125)">
            <rect x="0" y="0" width="60" height="40" rx="4" fill="#000000" />
            <rect x="4" y="4" width="52" height="32" rx="2" fill="#b2f746" />
            <path d="M -10,40 L 70,40 L 60,48 L -0,48 Z" fill="#000000" />
          </g>

          <!-- Code Brackets Bottom Left -->
          <g transform="translate(60, 135)">
            <rect x="0" y="0" width="55" height="36" rx="4" fill="#ec4899" stroke="#000000" stroke-width="2" />
            <text x="27" y="25" font-family="Space Grotesk" font-weight="700" font-size="20" text-anchor="middle"
              fill="#ffffff">&lt;/&gt;</text>
          </g>

          <!-- Star & Sparkle Doodles -->
          <path d="M 110,20 L 114,28 L 122,30 L 115,36 L 118,44 L 110,38 L 102,44 L 105,36 L 98,30 L 106,28 Z"
            fill="#ff761c" stroke="#000000" stroke-width="1.5" />
          <path d="M 310,25 L 313,31 L 320,32 L 315,37 L 317,43 L 310,39 L 303,43 L 305,37 L 300,32 L 307,31 Z"
            fill="#b2f746" stroke="#000000" stroke-width="1.5" />
          <path d="M 230,140 Q 260,170 300,150" fill="none" stroke="#000000" stroke-width="3" stroke-dasharray="6,4" />
          <path d="M 295,142 L 305,150 L 295,158" fill="none" stroke="#000000" stroke-width="3" />
        </svg>
      </div>
    </section>

    <!-- Search & Filter Bar Section -->
    <section class="filter-section">
      <div class="status-bar-wrapper">
        <span class="status-badge" id="status-badge">⚡ LAST UPDATED: JUST NOW</span>
      </div>

      <div class="filter-card">
        <div class="filter-form">

          <!-- Search Input -->
          <div class="input-group search-input-group">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Search aggregated events, themes, or tech..."
              autocomplete="off">
          </div>

          <!-- Location Selector -->
          <div class="select-group">
            <label for="location-select" class="sr-only">Location</label>
            <select id="location-select">
              <option value="">LOCATION: ALL</option>
              <option value="online">ONLINE</option>
              <option value="in-person">IN-PERSON</option>
              <option value="hybrid">HYBRID</option>
            </select>
          </div>

          <!-- Platform Selector -->
          <div class="select-group">
            <label for="platform-select" class="sr-only">Platform</label>
            <select id="platform-select">
              <option value="">PLATFORM: ALL</option>
              <option value="luma">LUMA</option>
              <option value="devfolio">DEVFOLIO</option>
              <option value="mlh">MLH</option>
              <option value="unstop">UNSTOP</option>
              <option value="devpost">DEVPOST</option>
              <option value="hackerearth">HACKEREARTH</option>
              <option value="hackclub">HACK CLUB</option>
              <option value="dorahacks">DORAHACKS</option>
            </select>
          </div>

          <!-- Filter Button -->
          <button class="btn btn-purple" id="filter-btn">FILTER</button>
        </div>
      </div>
    </section>

    <!-- Active Filter Tags Row -->
    <div class="active-tags-bar" id="active-tags-bar">
      <!-- Dynamically injected active filter chips -->
    </div>

    <!-- Hackathons Grid Section -->
    <section class="grid-section">
      <div class="hackathons-grid" id="hackathons-grid">
        <!-- Skeleton Loaders -->
        <div class="card skeleton-card"></div>
        <div class="card skeleton-card"></div>
        <div class="card skeleton-card"></div>
      </div>
    </section>

    <!-- View All / Load More CTA -->
    <section class="cta-section">
      <button class="btn-cta-banner" id="load-more-btn">
        <span id="load-more-text">VIEW ALL HACKATHONS</span>
        <span class="arrow">➔</span>
      </button>
    </section>

  </main>

  <!-- Lime Green Footer -->
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-brand">
        <span class="footer-logo">GLOBAL HACK</span>
      </div>

      <nav class="footer-nav">
        <a href="/terms">TERMS</a>
        <a href="/privacy">PRIVACY</a>
      </nav>

      <div class="footer-copyright">
        © 2026 GLOBAL HACKATHON. ALL RIGHTS RESERVED.
      </div>
    </div>
  </footer>

  <!-- App Script -->
  <script src="app.js"></script>
</body>

</html>
