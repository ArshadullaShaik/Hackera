<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e15" />
      <stop offset="100%" stop-color="#181a24" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="#a855f7" stroke-width="12" />

  <!-- Outer glowing accent ring -->
  <rect x="48" y="48" width="416" height="416" rx="80" fill="none" stroke="url(#glowGrad)" stroke-width="6" opacity="0.6" />

  <!-- Code symbol </ > -->
  <g filter="url(#neonGlow)">
    <!-- Left bracket < -->
    <path d="M 170 180 L 95 256 L 170 332" fill="none" stroke="url(#glowGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Slash / -->
    <path d="M 285 150 L 227 362" fill="none" stroke="#38bdf8" stroke-width="36" stroke-linecap="round" />
    <!-- Right bracket > -->
    <path d="M 342 180 L 417 256 L 342 332" fill="none" stroke="url(#glowGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
