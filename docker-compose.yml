services:
  postgres:
    image: postgres:16-alpine
    container_name: hackera-db
    environment:
      POSTGRES_USER: hackera_user
      POSTGRES_PASSWORD: hackera_password
      POSTGRES_DB: hackera_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackera_user -d hackera_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hackera-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackera-api
    command: ["node", "dist/api/server.js"]
    environment:
      DATABASE_URL: "postgresql://hackera_user:hackera_password@postgres:5432/hackera_db?schema=public"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      PORT: "3000"
      LOG_LEVEL: "info"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackera-worker
    command: ["node", "dist/queue/scrape.worker.js"]
    environment:
      DATABASE_URL: "postgresql://hackera_user:hackera_password@postgres:5432/hackera_db?schema=public"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
